<jelly-sidebar [initialFilters]="activeFilters()" (searchSubmitted)="onSearch($event)"></jelly-sidebar>
<div class="jelly-content">
   @if (!searchSubmitted()) {
      <p class="mt-3">{{initialText}}</p>
   }
   @if (isLoading()) {
      <p class="mt-3">Loading results...</p>
   } @else {
      <div class="results-grid"> 
         @for (result of searchResults(); track result.id) {
            <div class="col">
               <jelly-search-item [product]="result"></jelly-search-item>
            </div>
         }
      </div>
      @if (searchSubmitted() && searchResults().length === 0) {
         <p class="mt-3">No results found.</p>
      }
   }
</div>
