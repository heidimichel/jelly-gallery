<a [routerLink]="['/product', product.id]" class="search-item-card">
    <div class="d-flex flex-column align-items-center">
        <img class="product-img" [src]="product.pictures[0]" [alt]="product.name + ' (' + product.type + ')'"
            loading="lazy" />
        <p>{{ product.name }}</p>
    </div>
</a>
